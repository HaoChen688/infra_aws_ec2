name: Deploy to DEV

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      SITE_ROOT: /opt/site
      SITE_PORT: "80"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- 打包静态文件（public/ 下所有内容，含 assets/） ----------
      - name: Build artifact
        run: |
          set -euo pipefail
          if [ ! -d public ]; then
            echo "::error::public/ 目录不存在"
            exit 1
          fi
          if [ ! -f public/index.html ]; then
            echo "::error::public/index.html 不存在"
            exit 1
          fi
          mkdir -p dist
          tar -czf dist/site.tar.gz -C public .
          echo "--- artifact content ---"
          tar -tzf dist/site.tar.gz | head -50
          ls -lh dist/site.tar.gz

      - name: Upload artifact (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: site-dev-${{ github.sha }}
          path: dist/site.tar.gz
          retention-days: 7

      # ---------- 解析 DEV IP（tag:env=dev） ----------
      - name: Resolve DEV IP by tag
        id: host
        run: |
          set -euo pipefail
          IP=$(aws ec2 describe-instances \
            --filters "Name=tag:env,Values=dev" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].PublicIpAddress" --output text)
          if [ -z "$IP" ] || [ "$IP" == "None" ]; then
            echo "::error::No running DEV instance with tag env=dev."
            exit 1
          fi
          echo "ip=$IP" >> "$GITHUB_OUTPUT"

      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.DEV_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ steps.host.outputs.ip }}" >> ~/.ssh/known_hosts

      - name: Version
        id: ver
        run: |
          VERSION="dev-${GITHUB_SHA::7}-$(date -u +%Y%m%d%H%M%S)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION"

      # ---------- 上传 ----------
      - name: Upload artifact to server
        run: |
          set -euo pipefail
          scp -i ~/.ssh/id_ed25519 dist/site.tar.gz \
            deploy@${{ steps.host.outputs.ip }}:/tmp/site-${{ steps.ver.outputs.version }}.tar.gz

      # ---------- 发布：解包 → 切软链 → reload nginx → 健康检查 ----------
      - name: Release on server
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          SITE_ROOT: ${{ env.SITE_ROOT }}
          SITE_PORT: ${{ env.SITE_PORT }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 deploy@${{ steps.host.outputs.ip }} \
            "VERSION='$VERSION' SITE_ROOT='$SITE_ROOT' SITE_PORT='$SITE_PORT' bash -s" <<'EOF'
          set -euo pipefail
          : "${VERSION:?VERSION is empty}"
          : "${SITE_ROOT:?SITE_ROOT is empty}"
          : "${SITE_PORT:?SITE_PORT is empty}"

          echo "== Deploying $VERSION to $SITE_ROOT (port $SITE_PORT) on $(hostname) =="

          REL_DIR="$SITE_ROOT/releases/$VERSION"

          # 解包到新版本目录
          sudo mkdir -p "$REL_DIR"
          sudo tar -xzf "/tmp/site-$VERSION.tar.gz" -C "$REL_DIR"
          rm -f "/tmp/site-$VERSION.tar.gz"

          # 校验关键文件
          if [ ! -f "$REL_DIR/index.html" ]; then
            echo "index.html missing in $REL_DIR"
            sudo find "$REL_DIR" -maxdepth 2 -type f | head -50
            exit 1
          fi

          # 切软链
          sudo ln -sfn "$REL_DIR" "$SITE_ROOT/current"

          # nginx 配置检查 + reload
          if ! sudo nginx -t; then
            echo "nginx config test failed"
            sudo nginx -t || true
            exit 1
          fi
          sudo systemctl reload nginx

          # 健康检查：20 次 × 3 秒
          OK=0
          for i in $(seq 1 20); do
            if curl -fsS "http://localhost:${SITE_PORT}/" >/dev/null 2>&1; then
              echo "health OK (attempt $i)"
              OK=1
              break
            fi
            echo "waiting nginx... ($i)"
            sleep 3
          done

          if [ "$OK" -ne 1 ]; then
            echo "nginx check failed, diagnostics:"
            sudo systemctl status nginx --no-pager || true
            sudo nginx -t || true
            sudo tail -n 50 /var/log/nginx/error.log || true
            curl -v "http://localhost:${SITE_PORT}/" || true
            exit 1
          fi

          # 检查 assets 是否可访问
          if [ -f "$REL_DIR/assets/style.css" ]; then
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:${SITE_PORT}/assets/style.css" || true)
            echo "assets/style.css -> $code"
          fi

          echo "== Deploy done: $VERSION =="
          EOF

      - name: Output summary
        if: always()
        run: |
          {
            echo "### Deploy to DEV (nginx)"
            echo "- Version: \`${{ steps.ver.outputs.version }}\`"
            echo "- Host: \`${{ steps.host.outputs.ip }}\`"
            echo "- URL: http://${{ steps.host.outputs.ip }}/"
            echo "- Commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"