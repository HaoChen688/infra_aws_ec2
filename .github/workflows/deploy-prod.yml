name: Deploy to PROD

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to deploy (e.g. v1.0.0)"
        required: true

concurrency:
  group: deploy-prod
  cancel-in-progress: false   # 生产部署不取消进行中的任务

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod          # 需在 GitHub 设置里配置 required reviewers（人工审批）

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      SITE_ROOT: /opt/site
      SITE_PORT: "80"
      KEEP_RELEASES: "5"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${{ inputs.tag }}"
          fi
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid tag format: $VERSION (expected vX.Y.Z)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION"

      - name: Verify tag is on main
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          git fetch origin main --tags --force
          if ! git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag $VERSION not found"
            exit 1
          fi
          TAG_SHA=$(git rev-list -n 1 "refs/tags/$VERSION")
          if ! git merge-base --is-ancestor "$TAG_SHA" origin/main; then
            echo "::error::Tag $VERSION is not on main branch"
            exit 1
          fi
          echo "tag $VERSION is on main ($TAG_SHA)"

      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.version }}
          fetch-depth: 0

      # ---------- 打包静态文件（public/ 下所有内容，含 assets/） ----------
      - name: Build artifact
        id: build
        run: |
          set -euo pipefail
          if [ ! -d public ]; then
            echo "::error::public/ 目录不存在"
            exit 1
          fi
          if [ ! -f public/index.html ]; then
            echo "::error::public/index.html 不存在"
            exit 1
          fi
          mkdir -p dist
          tar -czf dist/site.tar.gz -C public .
          echo "--- artifact content ---"
          tar -tzf dist/site.tar.gz | head -50
          ls -lh dist/site.tar.gz
          SHA256=$(sha256sum dist/site.tar.gz | awk '{print $1}')
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "artifact sha256=$SHA256"

      - name: Upload artifact (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: site-prod-${{ steps.ver.outputs.version }}
          path: dist/site.tar.gz
          retention-days: 30

      # ---------- 解析 PROD IP（tag:env=prod，必须恰好一台 running） ----------
      - name: Resolve PROD IP by tag
        id: host
        run: |
          set -euo pipefail
          COUNT=$(aws ec2 describe-instances \
            --filters "Name=tag:env,Values=prod" "Name=instance-state-name,Values=running" \
            --query "length(Reservations[].Instances[])" --output text)
          if [ "$COUNT" != "1" ]; then
            echo "::error::期望恰好 1 台 running 的 PROD 实例（tag:env=prod），实际: $COUNT。请先执行 'Terraform PROD (provision)'。"
            exit 1
          fi
          IP=$(aws ec2 describe-instances \
            --filters "Name=tag:env,Values=prod" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].PublicIpAddress" --output text)
          if [ -z "$IP" ] || [ "$IP" == "None" ]; then
            echo "::error::No running PROD instance with tag env=prod."
            exit 1
          fi
          echo "ip=$IP" >> "$GITHUB_OUTPUT"

      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ steps.host.outputs.ip }}" >> ~/.ssh/known_hosts

      # ---------- 上传 ----------
      - name: Upload artifact to server
        run: |
          set -euo pipefail
          scp -i ~/.ssh/id_ed25519 dist/site.tar.gz \
            deploy@${{ steps.host.outputs.ip }}:/tmp/site-${{ steps.ver.outputs.version }}.tar.gz

      # ---------- 发布：解包 → 切软链 → reload nginx → 健康检查 → 失败回滚 ----------
      - name: Release on server
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          SITE_ROOT: ${{ env.SITE_ROOT }}
          SITE_PORT: ${{ env.SITE_PORT }}
          KEEP_RELEASES: ${{ env.KEEP_RELEASES }}
          ARTIFACT_SHA256: ${{ steps.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 deploy@${{ steps.host.outputs.ip }} \
            "VERSION='$VERSION' SITE_ROOT='$SITE_ROOT' SITE_PORT='$SITE_PORT' KEEP_RELEASES='$KEEP_RELEASES' ARTIFACT_SHA256='$ARTIFACT_SHA256' bash -s" <<'EOF'
          set -euo pipefail
          : "${VERSION:?VERSION is empty}"
          : "${SITE_ROOT:?SITE_ROOT is empty}"
          : "${SITE_PORT:?SITE_PORT is empty}"
          KEEP_RELEASES="${KEEP_RELEASES:-5}"

          echo "== [PROD] Deploying $VERSION to $SITE_ROOT (port $SITE_PORT) on $(hostname) =="

          REL_DIR="$SITE_ROOT/releases/$VERSION"
          LINK="$SITE_ROOT/current"

          # 0) 产物完整性校验
          if [ -n "${ARTIFACT_SHA256:-}" ]; then
            ACTUAL=$(sha256sum "/tmp/site-$VERSION.tar.gz" | awk '{print $1}')
            if [ "$ACTUAL" != "$ARTIFACT_SHA256" ]; then
              echo "artifact checksum mismatch: expected $ARTIFACT_SHA256 got $ACTUAL"
              exit 1
            fi
            echo "artifact checksum OK"
          fi

          # 1) 解包到新版本目录
          sudo mkdir -p "$REL_DIR"
          sudo tar -xzf "/tmp/site-$VERSION.tar.gz" -C "$REL_DIR"
          rm -f "/tmp/site-$VERSION.tar.gz"

          # 2) 校验关键文件
          if [ ! -f "$REL_DIR/index.html" ]; then
            echo "index.html missing in $REL_DIR"
            sudo find "$REL_DIR" -maxdepth 2 -type f | head -50
            exit 1
          fi

          # 3) 记录旧 current（用于回滚）
          PREV="$(readlink -f "$LINK" 2>/dev/null || true)"
          echo "previous current -> ${PREV:-<none>}"

          # 4) 切软链（原子替换）
          sudo ln -sfn "$REL_DIR" "$LINK"

          # 5) nginx 配置检查
          if ! sudo nginx -t; then
            echo "nginx config test failed, abort & rollback"
            if [ -n "${PREV:-}" ] && [ -d "$PREV" ]; then
              sudo ln -sfn "$PREV" "$LINK"
            fi
            exit 1
          fi

          # 6) reload nginx（兼容 systemd / 无 systemd；不再执行 `sudo nginx`）
          reload_nginx() {
            if command -v systemctl >/dev/null 2>&1 && systemctl is-active --quiet nginx 2>/dev/null; then
              sudo systemctl reload nginx
            else
              sudo nginx -s reload
            fi
          }

          rollback() {
            echo "!! rolling back current -> ${PREV:-<none>}"
            if [ -n "${PREV:-}" ] && [ -d "$PREV" ]; then
              sudo ln -sfn "$PREV" "$LINK"
              reload_nginx || true
              echo "rollback done"
            else
              echo "no previous release to rollback"
            fi
          }

          if ! reload_nginx; then
            echo "nginx reload failed, diagnostics:"
            sudo nginx -t || true
            sudo tail -n 50 /var/log/nginx/error.log || true
            rollback
            exit 1
          fi

          # 7) 健康检查：20 次 × 3 秒
          OK=0
          for i in $(seq 1 20); do
            if curl -fsS "http://localhost:${SITE_PORT}/" >/dev/null 2>&1; then
              echo "health OK (attempt $i)"
              OK=1
              break
            fi
            echo "waiting nginx... ($i)"
            sleep 3
          done

          if [ "$OK" -ne 1 ]; then
            echo "nginx check failed, diagnostics:"
            sudo nginx -t || true
            sudo tail -n 50 /var/log/nginx/error.log || true
            curl -v "http://localhost:${SITE_PORT}/" || true
            rollback
            exit 1
          fi

          # 8) 检查 assets 是否可访问（PROD 严格：非 200 视为失败）
          if [ -f "$REL_DIR/assets/style.css" ]; then
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:${SITE_PORT}/assets/style.css" || true)
            echo "assets/style.css -> $code"
            if [ "$code" != "200" ]; then
              echo "assets/style.css not 200, rollback"
              rollback
              exit 1
            fi
          fi

          # 9) 清理旧 release（保留最近 N 个，不删 current 指向）
          echo "== pruning old releases (keep $KEEP_RELEASES) =="
          ls -1dt "$SITE_ROOT"/releases/*/ 2>/dev/null | tail -n +$((KEEP_RELEASES + 1)) | while read -r d; do
            if [ "$(readlink -f "$LINK")" != "$(readlink -f "$d")" ]; then
              echo "removing $d"
              sudo rm -rf "$d"
            fi
          done

          echo "== [PROD] Deploy done: $VERSION =="
          EOF

      - name: Output summary
        if: always()
        run: |
          {
            echo "### Deploy to PROD (nginx)"
            echo "- Version: \`${{ steps.ver.outputs.version }}\`"
            echo "- Host: \`${{ steps.host.outputs.ip }}\`"
            echo "- URL: http://${{ steps.host.outputs.ip }}/"
            echo "- Tag: \`${{ steps.ver.outputs.version }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo ""
            echo "> 若 Release 步骤失败，服务器已自动尝试回滚到上一个 \`/opt/site/current\`。"
            echo "> 手动回滚：\`sudo ln -sfn /opt/site/releases/<old> /opt/site/current && sudo nginx -s reload\`"
          } >> "$GITHUB_STEP_SUMMARY"