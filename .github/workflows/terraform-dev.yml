name: Terraform DEV (provision)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        type: choice
        options: [plan, apply, destroy]
        default: plan
      admin_cidrs:
        description: "SSH allowed CIDRs (comma separated). Empty = use terraform.tfvars."
        required: false
        default: ""
      confirm_destroy:
        description: "Type 'destroy-dev' to confirm destroy"
        required: false
        default: ""

concurrency:
  group: terraform-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: dev
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    defaults:
      run:
        working-directory: ./envs/dev
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Guard destroy
        if: ${{ inputs.action == 'destroy' }}
        run: |
          if [ "${{ inputs.confirm_destroy }}" != "destroy-dev" ]; then
            echo "::error::To destroy DEV, set confirm_destroy=destroy-dev"
            exit 1
          fi

      - name: Render tfvars override (admin_cidrs)
        if: ${{ inputs.admin_cidrs != '' }} 
        env:
          ADMIN_CIDRS: ${{ inputs.admin_cidrs }}
        run: |
          python3 - <<'PY'
          import os
          raw = os.environ.get("ADMIN_CIDRS", "").strip()
          cidrs = [c.strip() for c in raw.split(",") if c.strip()]
          with open("override.auto.tfvars", "w") as f:
              f.write("admin_cidrs = [%s]\n" % ", ".join('"%s"' % c for c in cidrs))
          PY
          cat override.auto.tfvars


      - name: Terraform fmt 
        run: terraform fmt -check -recursive

      - name: Terraform init 
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        if: ${{ inputs.action != 'destroy' }}
        run: terraform plan -input=false -out=tfplan

      - name: Upload plan artifact
        if: ${{ inputs.action != 'destroy' }}
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-dev
          path: tfplan
          retention-days: 7

      - name: Terraform apply
        if: ${{ inputs.action == 'apply' }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Terraform destroy
        if: ${{ inputs.action == 'destroy' }}
        run: terraform destroy -input=false -auto-approve

      - name: Output summary
        if: ${{ inputs.action != 'destroy' }}
        run: |
          terraform output > /tmp/tf_out.txt
          echo "### Terraform DEV (${{ inputs.action }})" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/tf_out.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY